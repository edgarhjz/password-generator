<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1D285C;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .password-display {
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .password-display input {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
            font-family: monospace;
        }

        .password-display input:focus {
            border-color: #667eea;
        }

        .password-display .copy-btn {
            margin-top: 10px;
            padding: 10px 20px;
            background: #2A62CC;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .password-display .copy-btn:hover {
            background: #5568d3;
        }

        .error-banner {
            display: none;
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .option-group {
            display: flex;
            flex-direction: column;
        }

        .option-group label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .option-group input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .option-group .value {
            font-weight: bold;
            color: #333;
            text-align: right;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .checkbox-group label:hover {
            background: #f0f0f0;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label span {
            font-size: 14px;
            color: #333;
        }

        .generate-btn {
            width: 100%;
            padding: 15px;
            background: #2A62CC;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        .validate-section {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 2px solid #e0e0e0;
        }

        .validate-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .score {
            font-size: 36px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }

        .score.good { color: #4caf50; }
        .score.medium { color: #ff9800; }
        .score.bad { color: #f44336; }

        .feedback {
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        .feedback-item {
            padding: 5px 0;
        }

        .feedback-item.good { color: #4caf50; }
        .feedback-item.bad { color: #f44336; }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 22px;
            }

            .password-display input {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Password Generator</h1>

        <div id="errorBanner" class="error-banner" role="alert"></div>

        <div class="password-display">
            <input type="text" id="password" readonly placeholder="Your password will appear here" aria-label="Generated Password">
            <button type="button" class="copy-btn" id="copyBtn">📋 Copy Password</button>
        </div>

        <div class="options">
            <div class="option-group">
                <label for="length">Password Length</label>
                <input type="range" id="length" min="4" max="64" value="16">
                <span class="value" id="lengthValue">16</span>
            </div>

            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="uppercase" class="char-option" checked>
                    <span>Uppercase (A-Z)</span>
                </label>
                <label>
                    <input type="checkbox" id="lowercase" class="char-option" checked>
                    <span>Lowercase (a-z)</span>
                </label>
                <label>
                    <input type="checkbox" id="numbers" class="char-option" checked>
                    <span>Numbers (0-9)</span>
                </label>
                <label>
                    <input type="checkbox" id="symbols" class="char-option">
                    <span>Symbols (!@#$)</span>
                </label>
            </div>
        </div>

        <button type="button" class="generate-btn" id="generateBtn">Generate Password</button>

        <div class="validate-section">
            <h3>Password Strength</h3>
            <div class="score" id="score">0/5</div>
            <div class="feedback" id="feedback"></div>
        </div>
    </div>

    <script>
        const lengthInput = document.getElementById('length');
        const lengthValue = document.getElementById('lengthValue');
        const passwordInput = document.getElementById('password');
        const copyBtn = document.getElementById('copyBtn');
        const generateBtn = document.getElementById('generateBtn');
        const errorBanner = document.getElementById('errorBanner');
        const checkboxes = Array.from(document.querySelectorAll('.char-option'));

        function showError(message) {
            if (!message) {
                errorBanner.style.display = 'none';
                errorBanner.textContent = '';
                return;
            }
            errorBanner.textContent = message;
            errorBanner.style.display = 'block';
        }

        function renderValidation(validationData) {
            const scoreElement = document.getElementById('score');
            const feedbackElement = document.getElementById('feedback');

            scoreElement.textContent = `${validationData.score}/${validationData.max_score}`;
            scoreElement.className = 'score ' + (
                validationData.score >= 4 ? 'good' :
                validationData.score >= 2 ? 'medium' : 'bad'
            );

            feedbackElement.innerHTML = '';
            (validationData.feedback || []).forEach(item => {
                const div = document.createElement('div');
                div.className = 'feedback-item ' + (item === 'Password too short' ? 'bad' : 'good');
                div.textContent = item;
                feedbackElement.appendChild(div);
            });
        }

        async function generatePassword() {
            showError('');
            const length = parseInt(lengthInput.value, 10);
            const useUppercase = document.getElementById('uppercase').checked;
            const useLowercase = document.getElementById('lowercase').checked;
            const useNumbers = document.getElementById('numbers').checked;
            const useSymbols = document.getElementById('symbols').checked;

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        length,
                        use_uppercase: useUppercase,
                        use_lowercase: useLowercase,
                        use_numbers: useNumbers,
                        use_symbols: useSymbols
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    showError(data.error || 'Failed to generate password.');
                    return;
                }

                passwordInput.value = data.password;
                if (data.validation) {
                    renderValidation(data.validation);
                } else {
                    await validatePassword(data.password);
                }
            } catch (error) {
                console.error('Error generating password:', error);
                showError('Failed to connect to the server. Please try again.');
            }
        }

        async function validatePassword(password) {
            try {
                const response = await fetch('/api/validate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                if (!response.ok) return;
                const data = await response.json();
                renderValidation(data);
            } catch (error) {
                console.error('Error validating password:', error);
            }
        }

        async function copyPassword() {
            const password = passwordInput.value;
            if (!password) return;

            try {
                await navigator.clipboard.writeText(password);
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '✅ Copied!';
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                }, 2000);
            } catch (err) {
                showError('Failed to copy password to clipboard.');
            }
        }

        lengthInput.addEventListener('input', () => {
            lengthValue.textContent = lengthInput.value;
        });

        lengthInput.addEventListener('change', generatePassword);
        generateBtn.addEventListener('click', generatePassword);
        copyBtn.addEventListener('click', copyPassword);

        checkboxes.forEach(checkbox => {
            checkbox.addEventListener('change', (e) => {
                const checkedCount = checkboxes.filter(cb => cb.checked).length;
                if (checkedCount === 0) {
                    e.target.checked = true;
                    showError('At least one character type must remain selected.');
                    return;
                }
                generatePassword();
            });
        });

        window.addEventListener('DOMContentLoaded', generatePassword);
    </script>
</body>
</html>
